<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LatidosIA Voice Multi v1.2</title><style>
:root{--bg:#06111f;--card:#0b1b2c;--line:#21405e;--txt:#eef7ff;--muted:#8ca8c3;--a:#3ca7ff;--ok:#48df9b;--warn:#ffc857}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Segoe UI,Arial;background:radial-gradient(circle at 50% 0,#103a62 0,#06111f 44%);color:var(--txt)}
.wrap{max-width:1240px;margin:auto;padding:26px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:15px}.brand h1{margin:0;font-size:34px}.brand p{margin:5px 0;color:var(--muted)}
.pill{border:1px solid var(--line);border-radius:999px;padding:9px 13px;color:var(--muted)}.ok{color:var(--ok)}.grid{display:grid;grid-template-columns:.85fr 1.05fr 1.1fr;gap:16px}
.card{background:#0b1b2ce8;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 16px 55px #0005;min-height:280px}h2{margin:0 0 14px;font-size:19px}h3{font-size:15px;margin:14px 0 8px}
label{display:block;color:var(--muted);font-size:13px;margin:10px 0 5px}input,textarea,select{width:100%;background:#06111f;color:var(--txt);border:1px solid #294c6c;border-radius:10px;padding:10px}textarea{min-height:95px;resize:vertical}
button{border:0;border-radius:10px;padding:10px 13px;background:var(--a);color:white;font-weight:700;cursor:pointer}.secondary{background:#17334e}.danger{background:#512439}.train{background:#7957d5}.row{display:flex;gap:8px}.row>*{flex:1}
.voice,.sample{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}.voice.active{outline:2px solid var(--a)}.voice small,.sample small{display:block;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.status{color:var(--muted);font-size:13px;margin-top:9px}
.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 7px;font-size:11px;color:var(--muted);margin-right:5px}.log{white-space:pre-wrap;background:#050b12;border:1px solid var(--line);border-radius:10px;padding:10px;max-height:190px;overflow:auto;font:12px ui-monospace,monospace;color:#b8d2ea;margin-top:10px}audio{width:100%;margin-top:12px}
@media(max-width:950px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap">
<div class="top"><div class="brand"><h1>LatidosIA Voice Multi</h1><p>Zero-shot + LoRA por voz · Orpheus · v1.2</p></div><div id="health" class="pill">Comprobando…</div></div>
<div class="grid">
<section class="card"><h2>Perfiles de voz</h2><label>Nombre</label><input id="newName" placeholder="Ej. Jorge"><div class="row"><div><label>Idioma</label><select id="newLang"><option value="es">Español</option><option value="en">English</option><option value="pt">Português</option><option value="fr">Français</option></select></div><div><label>Estilo</label><select id="newStyle"><option>natural</option><option>narrador</option><option>conversacional</option><option>enérgico</option><option>sereno</option></select></div></div><label>Notas</label><textarea id="newNotes"></textarea><div class="actions"><button onclick="createVoice()">Crear perfil</button></div><div id="voiceList"></div></section>
<section class="card"><h2>Perfil seleccionado</h2><div id="empty">Selecciona una voz.</div><div id="detail" style="display:none"><div><span id="dName"></span><br><span id="dMeta" class="status"></span></div><h3>Muestras</h3><label>Audio</label><input id="sampleAudio" type="file" accept="audio/*"><label>Transcripción exacta</label><textarea id="sampleText"></textarea><div class="actions"><button onclick="addSample()">Añadir muestra</button><button class="secondary" onclick="prepareTraining()">Preparar dataset</button></div><h3>Entrenamiento LoRA</h3><div class="row"><div><label>Pasos</label><input id="trainSteps" type="number" value="200" min="10" max="5000"></div><div><label>LoRA rank</label><input id="trainRank" type="number" value="16" min="4" max="128"></div></div><div class="actions"><button class="train" onclick="startTraining()">Entrenar voz</button><button class="secondary" onclick="refreshTraining()">Actualizar estado</button><button class="danger" onclick="deleteVoice()">Eliminar voz</button></div><div id="trainStatus" class="status"></div><div id="trainLog" class="log" style="display:none"></div><div id="sampleList"></div></div></section>
<section class="card"><h2>Generar audio</h2><label>Voz</label><select id="genVoice" onchange="syncSamples()"></select><label>Muestra de referencia</label><select id="genSample"></select><label>Texto</label><textarea id="genText" style="min-height:220px"></textarea><div class="actions"><button onclick="generate()">Generar</button></div><div id="genStatus" class="status"></div><audio id="player" controls style="display:none"></audio><div id="download"></div></section>
</div></div><script>
let voices=[],selected=null,trainingTimer=null;
async function api(url,opt={}){let r=await fetch(url,opt),j;try{j=await r.json()}catch{j={detail:await r.text()}}if(!r.ok)throw new Error(j.detail||'Error');return j}
async function health(){try{let j=await api('/api/health'),e=document.getElementById('health');e.textContent=j.orpheus?'● Orpheus conectado · '+j.version:'● App '+j.version+' · Orpheus desconectado';e.classList.toggle('ok',j.orpheus)}catch{}}
async function loadVoices(){voices=await api('/api/voices');renderVoices();renderGen();if(selected){selected=voices.find(v=>v.id===selected.id)||null;renderDetail()}}
function renderVoices(){voiceList.innerHTML='';voices.forEach(v=>voiceList.innerHTML+=`<div class="voice ${selected&&selected.id===v.id?'active':''}" onclick="selectVoice('${v.id}')"><b>${v.name}</b><small>${v.language} · ${v.style} · ${v.samples.length} muestras</small><span class="badge">${v.training_status}</span></div>`)}
function renderGen(){let current=genVoice.value;genVoice.innerHTML='<option value="">Preset: tara</option>';voices.forEach(v=>genVoice.innerHTML+=`<option value="${v.id}">${v.name}${v.training_status==='trained'?' · LoRA':''}</option>`);if([...genVoice.options].some(o=>o.value===current))genVoice.value=current;syncSamples()}
function selectVoice(id){selected=voices.find(v=>v.id===id);renderVoices();renderDetail();refreshTraining()}
function renderDetail(){if(!selected){empty.style.display='block';detail.style.display='none';return}empty.style.display='none';detail.style.display='block';dName.innerHTML=`<b>${selected.name}</b>`;dMeta.textContent=`${selected.language} · ${selected.style} · ${selected.samples.length} muestras · ${selected.training_status}`;sampleList.innerHTML='';selected.samples.forEach(s=>sampleList.innerHTML+=`<div class="sample"><b>${s.filename}</b><small>${s.transcript.slice(0,90)}</small><div class="actions"><button class="danger" onclick="deleteSample('${s.id}')">Eliminar</button></div></div>`)}
async function createVoice(){let name=newName.value.trim();if(!name)return alert('Pon un nombre');await api('/api/voices',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,language:newLang.value,style:newStyle.value,notes:newNotes.value})});newName.value='';newNotes.value='';await loadVoices()}
async function addSample(){if(!selected)return;let f=new FormData(),a=sampleAudio.files[0],t=sampleText.value.trim();if(!a||!t)return alert('Falta audio o transcripción');f.append('audio',a);f.append('transcript',t);await api(`/api/voices/${selected.id}/samples`,{method:'POST',body:f});sampleAudio.value='';sampleText.value='';await loadVoices()}
async function deleteSample(id){await api(`/api/voices/${selected.id}/samples/${id}`,{method:'DELETE'});await loadVoices()}
async function deleteVoice(){if(!selected||!confirm('Eliminar este perfil y sus muestras?'))return;await api(`/api/voices/${selected.id}`,{method:'DELETE'});selected=null;await loadVoices();renderDetail()}
async function prepareTraining(){if(!selected)return;try{let j=await api(`/api/voices/${selected.id}/prepare-training`,{method:'POST'});trainStatus.textContent=`Dataset listo: ${j.samples} muestras`;await loadVoices()}catch(e){trainStatus.textContent=e.message}}
async function startTraining(){if(!selected)return;try{trainStatus.textContent='Iniciando entrenamiento…';await api(`/api/voices/${selected.id}/start-training`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({steps:+trainSteps.value,lora_r:+trainRank.value})});await refreshTraining();if(trainingTimer)clearInterval(trainingTimer);trainingTimer=setInterval(refreshTraining,3000)}catch(e){trainStatus.textContent=e.message}}
async function refreshTraining(){if(!selected)return;try{let j=await api(`/api/voices/${selected.id}/training-status`);trainStatus.textContent='Estado: '+j.status+(j.adapter_path?' · adaptador listo':'');trainLog.textContent=j.log||'';trainLog.style.display=j.log?'block':'none';if(['trained','failed'].includes(j.status)&&trainingTimer){clearInterval(trainingTimer);trainingTimer=null;await loadVoices()}}catch(e){trainStatus.textContent=e.message}}
function syncSamples(){let id=genVoice.value,v=voices.find(x=>x.id===id);genSample.innerHTML='<option value="">Primera muestra</option>';if(v)v.samples.forEach(s=>genSample.innerHTML+=`<option value="${s.id}">${s.filename}</option>`)}
async function generate(){genStatus.textContent='Generando…';try{let j=await api('/api/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text:genText.value,voice_id:genVoice.value||null,sample_id:genSample.value||null,use_adapter:true})});player.src=j.url;player.style.display='block';download.innerHTML=`<div class="actions"><a href="${j.url}" download><button class="secondary">Descargar WAV</button></a></div>`;genStatus.textContent='Audio generado'}catch(e){genStatus.textContent=e.message}}
health();loadVoices();setInterval(health,10000);
</script></body></html>
